[model]
package = "bonito.crf"

[labels]
labels = [ "N", "A", "C", "G", "T",]

[input]
features = 1

[global_norm]
state_len = 4

[qscore]
bias = -0.834
scale = 1.078

[encoder]
activation = "swish"
stride = 5
rnn_type = "lstm"
features = 384
scale = 5.0
winlen = 19
blank_score = 2.0

[basecaller]
batchsize = 512
chunksize = 10000
overlap = 500